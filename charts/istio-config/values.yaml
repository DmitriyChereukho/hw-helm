wallet:
  servicePort: 80
  host: wallet.example.com

currency:
  host: muffin-currency
  port: 8083
  appLabel: muffin-currency

ingress:
  gateway: muffin-gateway

  hosts:
    - wallet.example.com
    - prometheus.example.com

security:
  walletPrincipal: cluster.local/ns/muffin/sa/default

resilience:
  retries: 3
  perTryTimeout: 2s
  timeout: 5s

  maxPendingRequests: 5
  maxRequestsPerConnection: 5
  consecutive5xxErrors: 3
  interval: 5s
  baseEjectionTime: 30s

externalServices:
  postgres:
    host: host.minikube.internal
    port: 5432

prometheus:
  enabled: true
  host: prometheus.example.com

  namespace: monitoring
  serviceName: monitoring-kube-prometheus-prometheus
  servicePort: 9090
