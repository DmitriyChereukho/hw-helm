apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: prometheus
  namespace: {{ .Values.prometheus.namespace }}
spec:
  hosts:
    - {{ .Values.prometheus.host }}
  gateways:
    - muffin/{{ .Values.ingress.gateway }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.prometheus.serviceName }}.{{ .Values.prometheus.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.prometheus.servicePort }}
