{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: muffin-wallet
  namespace: {{ .Values.serviceMonitor.namespace }}
  labels:
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.serviceMonitor.selector | nindent 6 }}
  namespaceSelector:
    matchNames:
      {{- toYaml .Values.serviceMonitor.targetNamespaces | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitor.endpoint.port }}
      path: {{ .Values.serviceMonitor.endpoint.path }}
      interval: {{ .Values.serviceMonitor.endpoint.interval }}
{{- end }}
